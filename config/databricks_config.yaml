spark:
  shuffle_partitions: 4

logging:
  level: INFO

paths:
  landing_zone: "/Volumes/retail_lakehouse/landing/files"
  # bronze/silver/gold/quarantine paths below are ONLY used as a fallback
  # if unity_catalog.enabled is false. With it true (default), tables
  # are resolved as catalog.schema.table names instead and these paths
  # are never touched.
  bronze: "/Volumes/retail_lakehouse/landing/files/_fallback_bronze"
  silver: "/Volumes/retail_lakehouse/landing/files/_fallback_silver"
  gold: "/Volumes/retail_lakehouse/landing/files/_fallback_gold"
  quarantine: "/Volumes/retail_lakehouse/landing/files/_fallback_quarantine"

# Schema-per-layer: bronze.sales, silver.dim_customer, gold.fact_sales,
# quarantine.sales, etc. - one catalog, one schema per medallion layer,
# plain table names inside each. Every Bronze/Silver/Gold/Quarantine
# write is a MANAGED Unity Catalog table (saveAsTable) - no LOCATION,
# no cloud storage credentials needed.
unity_catalog:
  enabled: true
  catalog: "retail_lakehouse"
  schemas:
    bronze: "bronze"
    silver: "silver"
    gold: "gold"
    quarantine: "quarantine"
