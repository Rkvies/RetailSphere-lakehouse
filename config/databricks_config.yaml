spark:
  shuffle_partitions: 4

logging:
  level: INFO

paths:
  landing_zone: "/Volumes/retail_lakehouse/lakehouse/landing"
  bronze: "/Volumes/retail_lakehouse/lakehouse/lakehouse_data/bronze"
  silver: "/Volumes/retail_lakehouse/lakehouse/lakehouse_data/silver"
  gold: "/Volumes/retail_lakehouse/lakehouse/lakehouse_data/gold"
  quarantine: "/Volumes/retail_lakehouse/lakehouse/lakehouse_data/quarantine"

# This is the fix: every Bronze/Silver/Gold write also gets registered as
# a real Unity Catalog table via `CREATE TABLE ... USING DELTA LOCATION`,
# so it shows up in Catalog Explorer and is queryable as
# retail_lakehouse.lakehouse.bronze_sales / silver_dim_customer / gold_fact_sales
# etc. - not just visible as raw Parquet+_delta_log files in a Volume.
unity_catalog:
  enabled: true
  catalog: "retail_lakehouse"
  schema: "lakehouse"
